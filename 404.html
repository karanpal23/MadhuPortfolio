<style>
:root{

}
@media (prefers-color-scheme:dark){

    --bg:#0A1220;--panel:#0F1B2F;--ink:#E6EDF7;--muted:#94A3B8;

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
  background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.62}
.card{max-width:34rem;display:flex;flex-direction:column;gap:1.2rem}
.brand{display:flex;align-items:center;gap:.65rem}
.brand__mark{width:36px;height:36px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand__mark svg{width:22px;height:22px}
.brand__name{display:flex;flex-direction:column;line-height:1}
.brand__name b{font-size:1.02rem;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.brand__name span{font-family:var(--mono);font-size:.6rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}
.lbl{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2)}
h1{font-size:clamp(1.7rem,1.2rem+2vw,2.4rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:0}
h1 em{font-style:normal;color:var(--brand-2)}
p{margin:0;color:var(--muted)}
hr{border:0;border-top:1px solid var(--rule-strong);margin:0}
a.btn{align-self:flex-start;font-family:var(--sans);font-size:.92rem;font-weight:600;
  padding:.78rem 1.25rem;background:var(--brand);color:var(--brand-ink);border-radius:8px;
  text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;transition:transform .16s}
a.btn:hover{transform:translateY(-1px)}
a.btn svg{width:14px;height:14px}
</style>
